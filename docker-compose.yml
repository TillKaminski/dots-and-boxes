version: '3.8'
services:             
  dots-backend:
    image: ghcr.io/TillKaminski/dots-and-boxes/backend:latest
    container_name: dots-backend
    ports:
      - "8080:8000"
    restart: always
    pull_policy: always

  dots-frontend:
    image: ghcr.io/TillKaminski/dots-and-boxes/frontend:latest
    container_name: dots-frontend
    ports:
      - "4200:80"
    depends_on:
      - dots-backend
    restart: always
    pull_policy: always
