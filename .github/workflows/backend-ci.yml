name: ⚙️ CI - Backend (Tests, Linting, Coverage)

on:
  pull_request:
    paths:
      - 'backend/**'
      - '**/requirements.txt'
    branches: [ main ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Version
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black flake8 flake8-docstrings pytest
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          black --check backend/
          flake8 --config backend/.flake8 backend/

      - name: Run Tests and Coverage
        run: |
          python -m pytest --cov=backend --cov-report=xml:coverage.xml backend/tests/
      
      - name: Upload Cobertura Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: backend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
