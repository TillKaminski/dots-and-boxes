coverage:
  status:
    project: off
    patch: off

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - backend/
      statuses:
        - type: project
          target: 95%
          threshold: 5%
    - name: frontend
      paths:
        - frontend/
      statuses:
        - type: project
          target: 90%
          threshold: 10%
